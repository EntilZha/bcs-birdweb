slug: dunlin
common_name: Dunlin
scientific_name: Calidris alpina
order:
  name: Charadriiformes
  slug: charadriiformes
family:
  name: Scolopacidae
  slug: scolopacidae
status: Common winter west. Uncommon east.
species_of_concern: true
sections:
  general_description: This small shorebird is distinctive in breeding plumage, with a black belly-patch extending behind its black legs. Its head and breast are light-colored, and its back is bright rufous. In non-breeding plumage it is drab gray with a brownish head and breast. In flight it has white underwings, a white line down the middle of the upperwing, and white on either side of its rump and tail. The white underwings are especially distinctive in flight. As a flock twists and turns together in flight, white flashes of underwing are evident from a distance.
  habitat: Tundra-breeders, Dunlin typically nest in wet meadow tundra with low ridges, vegetation hummocks, and nearby ponds. During migration and winter, they prefer mudflats, but can also be seen on sandy beaches, coastal grasslands, estuaries, and occasionally in muddy, freshwater areas.
  behavior: Dunlin flocks are often huge, most impressive when they display their coordinated aerial maneuvers trying to escape predation by Peregrine Falcons and Merlins. When foraging, they either pick food from the surface or probe in the mud. They feed on exposed mud or in shallow water, making short runs interspersed with periods of feeding. They feed day or night, depending on the timing of low tide.
  diet: On the breeding grounds, insects and insect larvae are the most important source of food. In coastal habitats, Dunlin also eat marine worms, small crustaceans, mollusks, and other aquatic creatures. They sometimes eat seeds and leaves.
  nesting: Males typically arrive first on the breeding grounds. Pairs form when females arrive, but if arrival on the breeding grounds is delayed due to weather, pairs may form prior to arrival. Former mates often use the same territory as in the previous year. The male starts a few scrapes, which may be lined with grass, sedge, and willow leaves. The female chooses one and finishes the construction. The nest is usually well hidden under a clump of grass or on a hummock. Both parents incubate the four eggs for 20 to 22 days. The young leave the nest shortly after hatching and find their own food. Both parents tend the young, although the female usually abandons the group within a week of hatching. The male generally stays with the young until they are close to fledging, typically about 19 days.
  migration_status: Dunlin molt before they start the southward migration in the fall, and adults and juveniles migrate at generally the same time. Late-fall migrants, they are some of the last shorebirds to leave their wintering grounds. They are short- to medium-distance migrants, and travel from the low Arctic or sub-Arctic to temperate coastal areas in North America, and rarely as far as Central America. Juvenile plumage is seldom seen in Washington, although some birds in juvenile plumage (molting) can be seen in the eastern flyway.
  conservation_status: The Canadian Wildlife Service estimates the Dunlin population at 3,934,000 birds worldwide, with 1,325,000 in North America. Of that group, 500,000 birds make up the Pacific Coast population. Dunlin are currently the second most common shorebird in Washington, and the most common of Washington's wintering shorebirds, but numbers have declined in the Northwest in recent decades. There has been little habitat destruction or disturbance on the breeding grounds to date, but the migration and wintering grounds are threatened by destruction of habitat. There is currently no reliable information about population status or trends for Dunlin range-wide, so it is unknown if the trend in the Northwest is due to a decrease in population or a shift in range. Dunlin are considered an indicator species for assessing the health of Holarctic ecosystems, so determining range-wide population trends should be of high priority as reduction in their numbers could indicate that other species that use these ecosystems are at risk.
  when_where_wa: On the coast, Dunlin are rare throughout the summer. Fall migrants start showing up at the end of September. By October, they are common, and remain common through mid-May. Numbers peak at the end of March into April, as birds that wintered farther south join Washington's wintering birds before heading to the breeding grounds. By the end of May they are rare. They can be found in all the large coastal bays, but are usually patchily distributed, with thousands of birds in one spot, and none in a nearby, seemingly comparable area. Large flocks can usually be found, however, in Bellingham Bay (Whatcom County), Skagit Bay (Skagit County), Grays Harbor (Grays Harbor County), Willapa Bay (Pacific County), and the Columbia River Estuary (Pacific County). Most of these areas support flocks of 5,000 or more throughout the winter. The flock in Grays Harbor averages about 30,000 birds, with numbers much higher on occasion. Dunlin can also be seen in smaller flocks throughout the Puget Trough in winter. They are uncommon in eastern Washington during migration, with more moving through that region in the spring (from mid-April to mid-May) than fall (October). Small numbers also winter in eastern Washington, particularly at the Walla Walla and Yakima River deltas.
