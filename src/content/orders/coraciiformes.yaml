description: 'Members of this group of small to medium-sized stocky birds typically have large heads and small feet. Their most distinctive trait is the partial fusion of two toes in an arrangement known as syndactyly. The order includes familes as diverse as the rollers of the Old World and the motmots of the tropical Americas, but only one family reaches Washington:'
