description: 'These birds are aquatic, medium-sized to large, and feed on small fish and other animals found in the water. One of their most distinctive features is their feet, which have webbing between all four toes. Many have an unfeathered and sometimes brightly colored pouch of varying size at the throat. Most nest in colonies. Representatives of five of the order''s six families have been found in Washington:'
