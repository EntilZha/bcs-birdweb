name: Procellariiformes
common_name: null
description: 'The tube-nosed seabirds, as this group is sometimes called, spend much of their life on the high seas out of sight of land, gleaning food from the water''s surface. For most, the nesting season is the only time of the year that they touch land. They are drably colored—usually gray, black, or brown, with white—and range in size from small to very large. External nostrils on the upper mandible endow these birds with an unusually well developed sense of smell and contain a gland used for excreting salt. The order has four families worldwide, of which three are represented in Washington:'
