slug: passeriformes
name: Passeriformes
common_name: null
description: Members of this diverse group make up more than half of the bird species worldwide. Most are small. However their brains are relatively large and their learning abilities are greater than those of most other birds. Passerine birds are divided into two suborders, the suboscines and the oscines. Oscines are capable of more complex song, and are considered the true songbirds. In Washington, the tyrant flycatchers are the only suboscines; the remaining 27 families are oscines.
