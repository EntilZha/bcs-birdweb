slug: piciformes
name: Piciformes
common_name: null
description: 'Most birds in this group are adapted for climbing and perching in trees and range widely in size. The feet of most species have two toes pointing forward and two pointing back, a special adaptation for trunk-climbing known as a zygodactyl arrangement. The order includes families as diverse as the puffbirds and the toucans, but only the woodpecker family is found in Washington:'
