name: Apodiformes
common_name: null
description: 'The order, Apodiformes, contains the swifts and hummingbirds, birds that at first glance seem to have little in common. Both groups, however, are similar in the structure of their wings, modified for very rapid movement and both have tiny legs. Both swifts and hummingbirds also have only 10 tail feathers, not 12 like most other birds, and they share similarities in cranial structure. Swifts are found over much of the world, but hummingbirds are found only in the Americas. Both families are represented in Washington:'
source:
