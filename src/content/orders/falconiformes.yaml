description: 'The hawks, eagles, falcons, and allies make up a group known as the diurnal raptors, because they are active during the day. Members of this group typically use their acute vision to catch live vertebrate prey with their strong feet and toes. They vary from medium-sized to large birds and most have an upright posture and strong, short, hooked bills. The New World vultures (not closely related to the Old World vultures) were once classified with the herons and allies, but they have provisionally been grouped with the diurnal raptors on the basis of recent genetic studies. Members of the order Falconiformes in Washington fall into three families:'
