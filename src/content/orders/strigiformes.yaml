description: 'Owls have an upright posture, large heads, forward-facing eyes, and strong, sharp bills with a pronounced downward curve. Most are nocturnal or semi-nocturnal. Exceptional low-light vision and keen directional hearing enable them to pinpoint the location of prey. Owls typically have extensive feathering, with feathers often extending to the tips of the toes. Cryptically colored and patterned plumage helps to camouflage them as they rest by day. Their dense, soft feathers allow them to fly silently. The world''s two owl families are both represented in Washington:'
