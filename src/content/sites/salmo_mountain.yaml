name: Salmo Mountain
number: 704
ecoregions:
- canadian_rockies
sections:
  site: No other place in Washington feels more like the Canadian Rockies than Salmo Mountain in the extreme northeastern corner of the state. Except when closed by snow (late fall to spring), a well-maintained gravel road gives handy access to the subalpine zone at Salmo Pass (elevation 5,910 feet), while a rougher track allows you to drive nearly to the 6,828-foot summit. Explore the entire area around Salmo Pass on foot before continuing the rest of the way up the mountain.
  birds: Open forest of Engelmann spruce and subalpine fir, with a rich shrub understory, provides prime habitat for boreal species such as Spruce Grouse, American Three-toed Woodpecker, Boreal Chickadee, and Pine Grosbeak. This is probably the best spot in the state to find Boreal Owl and White-winged Crossbill. Other species possible here include Blue Grouse, Northern Goshawk, Golden Eagle, Northern Pygmy-Owl, Gray Jay, Clark's Nutcracker, Mountain Bluebird, Townsend's Solitaire, Fox Sparrow, and Red Crossbill. Cougars and grizzly bears are reported occasionally, and you should see or hear hoary marmots and pika galore. Steep slopes below the mountaintop and ridges are part of the remote Salmo-Priest Wilderness Area, home to the last remaining caribou in Washington. Trails into this rugged terrain are for experienced wilderness hikers only.
  directions: From Metaline Falls, take SR-31 northbound and turn right in about two miles onto Sullivan Lake Road, which goes past Mill Pond to an intersection on the left with FR-22 in a bit less than five miles. (Maps and other useful information may be had by continuing a half mile straight ahead to the Sullivan Lake ranger station.) Turn east onto FR-22 (Sullivan Creek Road). In six miles, swing left onto FR-2220, which climbs for 12-plus miles through mostly uncut conifer forest dominated by western hemlock, western red cedar, and Engelmann spruce to a fork at Salmo Pass. The left branch (FR-270) continues up Salmo Mountain for another two-plus miles, while the right branch ends in a short distance where the road is blocked at a trailhead parking lot. The closed road is the start of an easy-going, three-mile ridgetop trail through more subalpine forest habitats.
