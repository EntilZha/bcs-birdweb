slug: resources
title: Birding Resources
body: |-
  Select from one of the following resources to learn more about various aspects of
  birds and birding in Washington State. The information provided on this web site
  is subject to change. It is not meant to be definitive or exhaustive. We welcome
  your comments and input. Please e-mail birdweb@birdsconnectsea.org.

  ## Going birding? Be prepared.

  If you're meeting a group, go a few minutes early. Wear seasonally appropriate,
  and quiet, clothing and footwear. Always take enough food and water for the length
  of the trip. Be considerate of others, and stay with the group; forging ahead may
  scare away the birds and make it impossible for others to see. Lock your car. Hide
  your valuables. Respect private property. Use common sense.

  ## The Etiquette and Ethics of Birding

  We support the American Birding Association's [
  Code of Birding Ethics.](http://www.aba.org/about/ethics.html)

  Before using an audio device (like a bird audio smartphone app) in the field, we recommend reading [“The Proper Use of Playback in Birding” by David Allen Sibley.](http://www.sibleyguides.com/2011/04/the-proper-use-of-playback-in-birding/)

  ## Audubon Chapters

  Take a field trip with the local Audubon chapter! [
  Find the chapter](http://www.audubon.org/search-by-zip) nearest your destination.

  ## Getting Around

  How's traffic? [Check
  Washington State roads.](http://betatraffic.wsdot.wa.gov/traffic/default.aspx)
  What exit was that? [Interstate
  exits across Washington State.](http://wsdot.wa.gov/traffic/interstateguide)
  [Tide Tables]( https://tidesandcurrents.noaa.gov/tide_predictions.html?gid=1415) for
  the Washington Coast and Puget Sound
  [Washington State Ferry Schedules](http://www.wsdot.wa.gov/ferries/)

  ## Permits, Passes, and Parking

  Passes and Permits -- What you need to know before you go.

  [The Discover Pass](http://www.discoverpass.wa.gov/) is required for Washington state parks, water-access points, heritage sites, wildlife and natural areas, trails and trailheads.
  [Which
  recreation pass will you need at your destination?](https://www.discovernw.org/recreation-pass-guide.html)
  [Information](https://www.wta.org/go-outside/passes/what-pass-do-i-need-faq) about permits for national parks and wildlife refuges, Washington public lands, US Forest Service lands, etc.

  [Federal Duck Stamps](http://www.fws.gov/duckstamps/Info/Stamps/stampinfo.htm) are also accepted at national wildlife refuges, and they support waterfowl conservation.

  ## Reporting Banded Birds

  [USGS Patuxent Wildlife Research Center Bird Banding Laboratory](http://www.pwrc.usgs.gov/bbl/)

  12100 Beech Forest Road

  Laurel, MD 20708-4037

  Telephone: 301-497-5790

  Fax: 301-497-5717

  [Banded Crows in Seattle](http://courses.washington.edu/vseminar/main.htm#8Reporting)

