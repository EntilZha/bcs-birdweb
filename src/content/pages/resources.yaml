  ## Washington State Bird Festivals

  [Upper Skagit Bald Eagle Festival, late January
  or early February ](http://www.skagiteagle.org)
  [Othello Sandhill Crane Festival,
  late March](http://www.othellosandhillcranefestival.org/)
  [Olympic Peninsula BirdFest, late March/early
  April](http://www.olympicbirdfest.org)
  [Washington Brant Festival, Semiahmoo,
  mid-April](http://www.wabrant.org/)
  [Grays Harbor Audubon Shorebird Festival,
  late April/early May](http://www.shorebirdfestival.com/)
  [Leavenworth Spring Birdfest,
  mid-May](http://www.leavenworthspringbirdfest.com/)
  [Puget Sound Bird Fest, Edmonds, mid-May](http://www.pugetsoundbirdfest.com)
  [Audubon Wenas Campout, Early Summer](http://www.wenasaudubon.org/)
  [Ridgefield Bird Fest, mid-October](http://www.ridgefieldfriends.org/birdfest.php)

