slug: abundance-codes
title: Abundance Codes
body: |-
  Definitions of abundance codes (developed by the American Birding Association):

  The table shows an *average* status for months during which the abundance of a migratory species increases or decreases. For example, a species that is Rare in the first week of April but becomes Fairly Common by the last week may be shown as Uncommon for that month.

  Click on an ecoregion’s name to learn about its climate and topography, flora and fauna, and good places to look for the birds that live there. While many bird species will be of similar abundance in a given month throughout an ecoregion, some will not, perhaps occurring only in the southern or northern part, or in limited habitats. In such cases, the table shows the status for the part of the region where the species is *most abundant* in that month. For details about a species’ habitat preferences and local distribution, see the Washington range map and the sections on “Habitat” and “Where to Find in Washington” in its BirdWeb account.
