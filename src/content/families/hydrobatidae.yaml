slug: hydrobatidae
name: Hydrobatidae
common_name: Storm-Petrels
description: The smallest of the seabirds, the storm-petrels are usually predominantly dark brown or black, with white or light markings. Several species are mostly gray, including one species in the north Pacific. Many are migratory, and all are nocturnal at the nesting colonies. They fly very close to the water, and much of their feeding is done in flight. Incubation time and the time from hatching to fledging are highly variable because bad weather may prevent the adults from returning to the nest for several days. Eggs can hatch even if incubation is interrupted for up to 25 days, and young can survive extended periods of time between feedings, up to three weeks, by going into torpor, a sort of mini-hibernation to save energy. The ability of the egg to survive with suspended incubation and for the chick to become torpid are important for survival, since the adults spend a lot of time away from the nest looking for food that can be hard to find.
order: procellariiformes
