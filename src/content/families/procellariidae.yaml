slug: procellariidae
name: Procellariidae
common_name: Shearwaters and Petrels
description: This group is diverse and ranges widely in size. A common trait that all members of this family share is that their nostrils are located in a single tube at the top of their bills. Most maneuver well in high winds, and many migrate long distances. Most, but not all, nest in burrows. Those that do nest in burrows visit them only at night. The well-developed sense of smell of the shearwaters may help them find their burrows in the dark.
order: procellariiformes
source:
