slug: pelecanidae
name: Pelecanidae
common_name: Pelicans
description: Pelicans are known for their large, pouched bills, which they use as fishing nets. They are social birds, feeding, flying, and breeding in groups. They are among the heaviest flying birds, the largest species approaching 30 pounds, and many require a running start to get airborne. Heavy flaps interspersed with long glides characterize flight.
order: pelecaniformes
source:
