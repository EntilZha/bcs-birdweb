slug: odontophoridae
name: Odontophoridae
common_name: New World Quail
description: Similar to their larger cousins, the grouse, members of the quail family are mostly non-migratory, ground-dwelling birds. Most inhabit early-successional brushy areas. Omnivores, quail eat mostly vegetative matter in winter, and switch to invertebrates in the summer. Pairs are typically monogamous. In the non-breeding season, small flocks called "coveys" gather together. The young are precocial, able to walk about and feed themselves almost immediately after hatching. This enables quail to have large clutches of young.
order: galliformes
