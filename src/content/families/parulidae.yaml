slug: parulidae
name: Parulidae
common_name: Warblers
description: This large group of small, brightly colored songbirds is a favorite of many birdwatchers. Wood-warblers, usually called “warblers” for short by Americans, are strictly a New World family. Most of the North American members of this group are migratory, returning in the winter to the tropics where the family originated. Warblers that nest in the understory tend to have pink legs and feet, while those that inhabit the treetops usually have black legs and feet. North American males are typically brightly colored, many with patches of yellow. Most North American warblers do not molt into a drab fall/winter plumage; the challenge posed to those trying to identify warblers in the fall results from looking at mostly juvenile birds. Their songs are generally dry, unmusical, often complex whistles (“warbles”). Warblers that live high in the treetops generally have higher-pitched songs than those that live in the understory. Warblers eat insects gleaned from foliage or captured in the air. Many supplement their insect diet with some seeds and fruit, primarily in fall and winter, and some also eat nectar. Most are monogamous. The female usually builds the nest and incubates four to five eggs for up to two weeks. Both members of the pair feed the young.
order: passeriformes
