slug: stercorariidae
name: Stercorariidae
common_name: Skuas and Jaegers
description: The predatory jaegers and skuas are seagoing birds that nest in cold climates in the far north and south and spend the rest of the year at sea, hunting live prey and harassing other seabirds to steal food. They nest on the ground in isolated pairs or small groups. Clutch size is generally two eggs. Both parents incubate the eggs and help feed the young. The young typically hatch covered with brownish or grayish down and leave the nest after one or two days but stay nearby until fledging.
order: charadriiformes
source:
