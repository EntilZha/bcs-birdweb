slug: cuculidae
name: Cuculidae
common_name: Cuckoos
description: The cuckoo family is a diverse family of birds with no close relatives. The majority of this family resides in the Old World, where many members are parasitic, laying their eggs in the nests of other birds. The cuckoos and allies that live in North America are less likely to parasitize nests, but some may occasionally do so. Most are omnivores that live and forage in dense foliage and can be hard to see. They are typically monogamous, with both members of the pair helping to rear the young.
order: cuculiformes
source:
