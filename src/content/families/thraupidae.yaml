slug: thraupidae
name: Thraupidae
common_name: Tanagers
description: The tanagers are a large and diverse New World family with most members in the tropics. They are medium-sized birds with stout, generalized bills that allow them to eat both fruit and insects. Tanagers in the tropics have a number of differences from tanagers in the northern temperate zone. Most tropical tanagers are monomorphic, that is, males and females look alike. Most tanagers of the temperate zone exhibit a great degree of sexual dimorphism—males are brightly colored, and females are usually drab. Tropical tanagers are non-migratory and often gather in large, dramatic, mixed flocks. Northern-breeding tanagers are migratory and generally solitary but occasionally gather in small groups, especially during migration. Tanagers are generally monogamous. Females build the nest and incubate the young, and both sexes help feed the young. Even with their bright plumage, tanagers can be difficult to see, as they inhabit the forest canopy.
order: passeriformes
