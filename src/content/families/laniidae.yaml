slug: laniidae
name: Laniidae
common_name: Shrikes
description: Shrikes are predatory songbirds, with bills adapted for killing prey. Most members of the family are found in Eurasia and Africa, but two are resident in North America. These solitary birds perch in conspicuous spots on top of fence posts, on wires, and in trees and shrubs. From there, they pounce on large insects or small vertebrate prey. Because their feet are not strong enough to hold and tear flesh, shrikes impale their prey on a thorn or barbed wire tine or lodge it in a tree crotch to hold it while they feed. Shrikes often leave the carcasses of larger prey impaled or lodged, returning to them later for further meals. Shrikes are typically monogamous, and both parents raise the young.
order: passeriformes
