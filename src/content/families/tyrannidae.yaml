slug: tyrannidae
name: Tyrannidae
common_name: Tyrant Flycatchers
description: Unlike most passerines found in North America, flycatchers are suboscines. Suboscines have a simpler syrinx (voice box) than the oscines (songbirds), and hence have less-developed and less-elaborate songs. Their song is innate, and does not contain a learned component. The flycatchers are the only suboscine passerines found in North America north of Mexico. Nearly all suboscines (and all Tyrannidae) are native to the New World, and they are much more numerous in the tropics, where several other families occur in addition to the Tyrannidae. Flycatchers are named for their foraging style. They sit quietly on a perch and dart out to grab a flying insect from the air, and then return to their perch to wait for the next meal to fly by. Many also forage by hovering next to foliage or over the ground. Most have a distinct, upright posture and a slight crest. They have small feet as they do not typically walk or run on the ground. Most flycatchers are monogamous. The female generally builds the nest, incubates the eggs, and broods the young, although both parents feed the young. Flycatchers of the genus *Empidonax* pose many identification challenges for birders. Range, habitat, vocalizations, and behavior must all be taken into account to distinguish between members of this group.
order: passeriformes
