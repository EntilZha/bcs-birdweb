slug: motacillidae
name: Motacillidae
common_name: Wagtails and Pipits
description: 'The wagtails and pipits are small to medium-sized open-country ground-dwellers. Pipits are found worldwide, but wagtails are generally restricted to the Old World. Wagtails are often brightly colored with high-contrast patterns, and pipits are typically cryptically colored and patterned. Wagtails are sexually dimorphic: males and females have different plumage. Pipits are generally not sexually dimorphic, that is, males and females look alike. Wagtails and most pipits bob or wag their tails and bob their heads as they walk along the ground. Most are long-distance migrants. They eat primarily insects and other invertebrates, which they take from the ground, but they also eat seeds and fruit. They are monogamous, and both parents help tend the young.'
order: passeriformes
source:
