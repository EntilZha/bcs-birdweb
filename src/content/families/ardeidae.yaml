slug: ardeidae
name: Ardeidae
common_name: Herons, Bitterns and Allies
description: Herons and egrets are wading birds that generally inhabit wetlands and slow-moving waters. Most are long-legged, and they hunt by waiting motionless, peering into the water, watching for prey. The majority are colony nesters, often raising young in colonies of mixed species. Monogamy is the norm, although pair bonds usually last for a single breeding season. Both parents help build the nest. Typically, the male brings material, and the female constructs the nest, which is usually built of sticks. Both parents incubate, and both feed the young by regurgitation.
order: ciconiiformes
source:
