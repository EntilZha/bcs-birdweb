slug: corvidae
name: Corvidae
common_name: Crows, Jays and Allies
description: The crows, jays, and allies are intelligent and crafty birds. They are opportunistic, and most thrive living among humans. For this reason, many have been persecuted as pests. Many members of this family cache, or store, food for the winter, which allows them to be year-round residents at high altitudes and in northern climates. Many live in forests, and most nest in trees. Crows, ravens, magpies, and jays are generally long-lived and monogamous, and form long-term pair bonds. Some species have helpers at the nest. Their nests are typically bulky and made from sticks, and both sexes generally help build them. Females incubate the young, but there are exceptions where the male helps. Both sexes usually feed and care for the young. The corvids are omnivores, eating seeds, nuts, insects, carrion, and small vertebrates. They often rob the nests of other birds of eggs and nestlings. Most are social, forming flocks, especially outside the breeding season.
order: passeriformes
