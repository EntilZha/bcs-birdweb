slug: alaudidae
name: Alaudidae
common_name: Larks
description: Ground-dwelling songbirds of the open country, larks are mostly an Old World family. Most are well camouflaged and adapted to grassland or dry soil habitats. In most species, only the female incubates, but both parents tend and feed the young. Most larks have striking flight-song displays. Larks sing while flying high into the air, advertising, and defending their territories. The Horned Lark is the only lark native to Washington, but the Sky Lark, introduced from Eurasia, formerly bred here.
order: passeriformes
source:
