slug: aegithalidae
name: Aegithalidae
common_name: Bushtits
description: 'The family of long-tailed tits is made up of very small birds with moderately long tails. The Bushtit is the only member of this group found in North America. Most inhabit shrubs and open woodlands where they glean insects from leaves and other surfaces. Flocking is the norm for this group. Most are monogamous during the breeding season, but pair bonds rarely persist from year to year. They are generally non-migratory. The pendulous nest of the Bushtit is typical for this family. Generally both members of the pair provide parental care: building the nest, incubating, brooding, and feeding are all conducted by both sexes.'
order: passeriformes
source:
