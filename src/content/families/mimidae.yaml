slug: mimidae
name: Mimidae
common_name: Mockingbirds, Thrashers and Allies
description: The Mimids compose a relatively small New World family. Well known for their elaborate vocalizations and mimicry abilities, they often sing repeated phrases within their extended songs. Mimids are medium-sized songbirds with strong legs, long bills, and gray or brown plumage. Many have streaked or spotted breasts. Most forage on the ground, and use their long bills to dig in the soil. They seldom form flocks, and are found in pairs or family groups. They eat a combination of animal and vegetable matter, with more insects and other invertebrates in the diet in the spring and summer, and more nuts and berries in the fall and winter. They usually nest in dense, low shrubs, and both parents help build the nest, incubate, and care for the young.
order: passeriformes
