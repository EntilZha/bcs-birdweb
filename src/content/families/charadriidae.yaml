slug: charadriidae
name: Charadriidae
common_name: Plovers
description: 'Plovers are small to medium-sized shorebirds with round heads, short bills, large eyes, and short necks. They live on the ground in open habitats, mostly near water. They build a simple scrape nest on the ground, in which they lay 3–4 eggs. Both parents incubate and care for the young, although newly hatched chicks walk and feed themselves soon after hatching. Plovers eat small invertebrates, and their foraging style is what sets them apart from other shorebirds. Plovers are visual feeders: while foraging, they run, pause, eat, run, and pause repeatedly. This upright style contrasts with that of sandpipers, which are most often seen head down, probing for underground prey. Plovers also typically do not nest as far to the north as most sandpipers and do not migrate as far.'
order: charadriiformes
source:
