slug: gaviidae
name: Gaviidae
common_name: Loons
description: Called "divers" in much of the world, loons are large aquatic birds of the north and far north. Males and females look alike, and have distinct breeding and non-breeding plumages. All species nest on fresh water but are found most commonly in winter on salt water. Both parents participate in raising the young. There are only five species of loons worldwide, and all five have been seen in Washington.
order: gaviiformes
