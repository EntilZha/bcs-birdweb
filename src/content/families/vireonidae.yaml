slug: vireonidae
name: Vireonidae
common_name: Vireos
description: This family is found only in the New World. Vireos are small birds that move about slowly and deliberately as they glean insects from foliage and twigs. Their bills are cylindrical, with a slight hook at the end. These bills are relatively large for birds their size, which enables them to eat fairly large insects. Most vireos are drab colored, with olive-green or yellow upperparts and lighter olive or buffy underparts. Many have eye-rings, eye-lines, or wing-bars. In Washington, vireos with wing-bars have eye-rings, and those without wing-bars have eye-lines. Vireos are often hard to see as they forage in high or thick foliage, and when found are generally alone or in pairs rather than in large flocks. Most have fairly simple songs that they sing repeatedly, many singing through the entire day and even while on the nest. Nests are generally suspended from small horizontally forked branches. Pairs are monogamous, and both parents raise the young.
order: passeriformes
