slug: alcedinidae
name: Alcedinidae
common_name: Kingfishers
description: Kingfishers typically have crested heads and long, sturdy bills. Although only a handful of species are found in the Western Hemisphere and only one makes it as far north as Washington, there are far more species in other parts of the world. Many have brightly colored plumage. Kingfishers plunge into the water from above to catch fish and other aquatic creatures in their bills. Their partially fused toes may aid them in digging nest burrows.
order: coraciiformes
