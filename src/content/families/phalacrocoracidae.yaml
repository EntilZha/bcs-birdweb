slug: phalacrocoracidae
name: Phalacrocoracidae
common_name: Cormorants
description: Cormorants are large birds with long, flexible necks, short, rounded wings, and wedge-shaped tails. Most are predominantly shiny black, and males and females look alike. Diving to catch fish, they swim underwater and use their feet but not their wings to propel themselves. Their feathers get waterlogged quickly, which aids them in diving by reducing their buoyancy. As a result, they need to dry out between dives, and many species are often seen perched with wings spread. Distributed throughout temperate and tropical waters, cormorants most often live along marine coastlines, but a few species live on inland waters as well. They are colony nesters, nesting on banks, cliffs, or trees, often on islands. Both parents raise the young.
order: pelecaniformes
