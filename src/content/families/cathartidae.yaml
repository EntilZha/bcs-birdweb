slug: cathartidae
name: Cathartidae
common_name: New World Vultures
description: The family name, Cathartidae, comes from the Greek word for cleanser, and that is exactly the function these scavengers serve—cleaning dead animals from the land. They are often seen soaring overhead, looking for dead animals to eat. Their bald heads help them stay clean when eating carrion. These sociable birds often gather in communal roosts at night and will gather to feed around large carcasses. Their nesting sites are usually far removed from the disturbance of humans. They generally lay two eggs, which both parents help incubate. They regurgitate ingested food for their young.
order: falconiformes
