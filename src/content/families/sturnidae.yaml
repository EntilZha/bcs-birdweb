slug: sturnidae
name: Sturnidae
common_name: Starlings
description: All members of the Starling and Myna family are native to the Old World, and populations in North America are the results of introductions. They tend to have short, triangular or rounded wings, and short, square tails. Members of this family are highly social and typically flock in all seasons. Many are colonial breeders. They have strong legs and feet and usually forage on the ground. Most members of this family are omnivores, eating invertebrates, seeds, fruits, and eggs. Most are monogamous and both members of a pair typically help build the nest, incubate, and tend the young.
order: passeriformes
