slug: cardinalidae
name: Cardinalidae
common_name: Grosbeaks, Buntings and Allies
description: 'This group, the cardinalids, is made up of medium-sized songbirds that primarily inhabit open areas and woodland edges. The family is tropical in origin and restricted to the Americas. Northern-breeding members generally have strong sexual dimorphism: adult males are brightly colored, while females are drab. They are seedeaters and have powerful, conical bills that can crack seeds. These birds also eat fruit and insects. Most of those that breed in the northern temperate zone are migratory and monogamous. The common names of several species in the Cardinalidae family can be confusing, because some birds that are called buntings or grosbeaks belong to different families. Snow Bunting, McKay’s Bunting, and Rustic Bunting are actually members of the Emberizidae, and Evening Grosbeak belongs to the Fringillidae.'
order: passeriformes
