slug: recurvirostridae
name: Recurvirostridae
common_name: Stilts and Avocets
description: Stilts and avocets make up a small, but worldwide family. These medium to large shorebirds are delicate and graceful looking, with long necks, small heads, and long, thin legs and bills. They are typically found in wetland areas, and their long legs allow them access to deeper water than many other shorebirds. Stilts have straight bills, while avocets' bills are up-curved. The stilts and avocets are unusual among the shorebirds in that they are colony nesters. They typically lay four well-camouflaged eggs in a simple scrape on the ground. Both parents incubate and care for the chicks, although the young feed themselves.
order: charadriiformes
