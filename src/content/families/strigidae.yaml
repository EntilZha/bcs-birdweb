slug: strigidae
name: Strigidae
common_name: Typical Owls
description: Most of the world’s owls belong to this family. The differences between the two owl families are primarily structural. The facial disks and heads of typical owls are more round than those of Barn Owls, and their legs are generally shorter.
order: strigiformes
