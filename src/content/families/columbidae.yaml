slug: columbidae
name: Columbidae
common_name: Pigeons and Doves
description: Most of the members of this group live in tropical or semi-tropical parts of the world. The term "pigeon" refers to the larger and "dove" to the smaller species in this group, although this usage is not consistent. Most pigeons and doves have plump bodies and soft plumage. The Washington members of this group are drab, but some have iridescent patches. Pigeons and doves are all strong fliers. One unique trait of this family is the ability to drink without tipping the head back, something no other bird can do. Pigeons and doves feed on seeds and fruits. Unlike many granivorous birds that switch to a diet of insects when raising young, pigeons have a unique system for feeding their young. Both males and females produce in their crops a protein- and fat-rich liquid called "pigeon milk," which they feed to their young. Most pigeons and doves lay clutches of one or two eggs.
order: columbiformes
