slug: anatidae
name: Anatidae
common_name: Ducks, Geese and Swans
description: The waterfowl family is represented in Washington by two distinct groups—the geese and swans, and the ducks. Whistling-ducks are also considered a distinct subfamily, and, although they have not been sighted in Washington in many years, Fulvous Whistling-Ducks have been recorded historically in Washington and remain on the official state checklist. All members of the waterfowl family have large clutches of precocial young. They hatch covered in down and can swim and eat on their own almost immediately after hatching.
order: anseriformes
