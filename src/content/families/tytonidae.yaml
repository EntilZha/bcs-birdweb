slug: tytonidae
name: Tytonidae
common_name: Barn Owls
description: The family Tytonidae is a widely distributed family of owls, inhabiting woodlands, farmlands, and savannas on every continent except Antarctica. There is one North American representative—the Barn Owl. This species is very similar to the typical owls (Strigidae) in habits and functions. Most of the differences between the two groups are structural. The facial disks of Barn Owls are more heart-shaped, rather than round, and their heads are longer and narrower overall. They have longer legs than typical owls.
order: strigiformes
