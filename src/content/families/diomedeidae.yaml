slug: diomedeidae
name: Diomedeidae
common_name: Albatrosses
description: The albatrosses are large seabirds with very long wings. They have a unique flight, soaring on the wind currents above the waves, hardly ever flapping their wings, possibly even sleeping on the wing. This flight requires strong winds, and in the absence of these winds, they will be found swimming on the water's surface. They also forage on the surface of the water; some may dive under water, while others dabble at the surface. Albatrosses may live a very long time, more than 40 or 50 years in some cases. The majority of albatrosses live in the Southern Hemisphere and breed during the southern spring and summer. Even those that breed in the Northern Hemisphere breed during our winter. Two separate tubes are located on either side of the albatross's bill.
order: procellariiformes
