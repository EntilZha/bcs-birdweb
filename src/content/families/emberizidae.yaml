slug: emberizidae
name: Emberizidae
common_name: Sparrows, Towhees, Longspurs and Allies
description: The Emberizidae family is made up of the New World sparrows, longspurs, and some of the buntings. Most forage and nest on the ground. Most emberizids are seedeaters and have short, thick bills adapted for this diet, although they all eat insects and other arthropods at times, and feed them to their young. They are typically monogamous. Females generally build the nests and incubate the eggs and young, but both parents feed the young. Clutches are small, generally three to five eggs. Many of these birds are small, brown, and streaked, and stay close to cover, making identification challenging.
order: passeriformes
source:
