slug: passeridae
name: Passeridae
common_name: Old World Sparrows
description: The Old World Sparrows (family Passeridae) are stout, short-legged, seed-eating birds. They have heftier bodies and stouter bills than our native sparrows. They are usually brown, buff, or gray, with black or white markings. Most members of this family are usually found near humans and cultivated areas. This family’s greatest diversity is in northern Africa and Europe. There are only two members in North America, and both were introduced to this part of the world. The House Sparrow is the only species present in Washington.
order: passeriformes
