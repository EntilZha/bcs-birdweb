slug: turdidae
name: Turdidae
common_name: Thrushes
description: The thrushes are a large family of songbirds found worldwide. The eight species found regularly in Washington have a diet that varies seasonally between insects and other invertebrates in the summer, and berries in the winter. Most are short-distance migrants, but some migrate to the tropics. Many of the thrushes forage primarily on the ground. The thrushes are known for their beautiful, flute-like songs, and are considered some of the best songsters in Washington.
order: passeriformes
source:
