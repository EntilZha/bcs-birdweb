slug: regulidae
name: Regulidae
common_name: Kinglets
description: This is a small family distributed around the Northern Hemisphere. Both North American species are found in Washington. Kinglets are tiny insectivores that actively forage for insect and spider eggs on the undersides of foliage. They weigh less than an ounce and are among the smallest of songbirds. They often hover in front of a branch, gleaning food from its tips and undersides. Kinglets often flick their wings as they move about. Both Washington species join mixed-species flocks during migration and in winter. Kinglets are monogamous. They build deep nests that hang from conifer branches and lay large clutches of eggs. Although males usually do not incubate, both parents feed and tend the young.
order: passeriformes
