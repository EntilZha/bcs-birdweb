slug: phasianidae
name: Phasianidae
common_name: Partridges, Grouse and Turkeys
description: Pheasants, partridges, grouse, and turkeys are mostly ground-dwelling birds, although many forage or roost in trees during the winter. They do not migrate long distances, although they often use different habitats seasonally. They are omnivores, eating mostly plant matter in the winter and insects in the summer. Many of the males in this family have loud and dramatic displays. Nests are built on the ground, and clutch size is usually large. The young are precocial, able to walk and feed themselves within a few hours of hatching.
order: galliformes
