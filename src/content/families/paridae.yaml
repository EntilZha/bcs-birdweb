slug: paridae
name: Paridae
common_name: Chickadees
description: Chickadees and titmice are small, sociable, energetic birds with short, pointed bills. There are four species of chickadees in Washington, and they generally have dark caps and throat patches, with white on their cheeks. The titmice typically have crests, and they are not represented in Washington. Males, females, and immatures have similar plumages. Most chickadee species are non-migratory; however, some populations of Black-cappeds have been shown to have extensive migration patterns in certain years. Most species live in forested habitats where they forage for seeds, insects, and spiders. Many are frequent visitors to seed and suet feeders. They have specially adapted legs that enable them to hang upside-down, which they do often when gleaning prey from twigs, bark, and foliage. They store food to survive the winter and are able to find an impressive percentage of cached food. Chickadees are typically monogamous and territorial during the breeding season, but form flocks (often of mixed species) with distinct dominance hierarchies the rest of the year. They are cavity-nesters, and many excavate their own cavities, an impressive feat considering their tiny bills. They excavate only in soft, rotten wood, and will also use old woodpecker holes, nest boxes, or other cavities. Both members of the pair may excavate, but females generally build the nests, which are usually made of a mossy base with soft hair or other material on top. The female incubates and broods the young, and both parents provide food.
order: passeriformes
