slug: trochilidae
name: Trochilidae
common_name: Hummingbirds
description: Hummingbirds are tiny, nectar- and insect-eating birds. Their unique manner of flight allows them to fly forwards, backwards, or hover in one spot. Hummingbirds are found only in the Western Hemisphere, and most are found in tropical areas. Of the species that live in Washington, all but one migrate south in the winter. Male hummingbirds often have an iridescent throat patch called a "gorget." The females build the nests, incubate, and feed the young without assistance from males. Hummingbirds are among the smallest of warm-blooded animals and often consume more than half their total weight in food and twice their weight in water in a single day.
order: apodiformes
