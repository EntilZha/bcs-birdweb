slug: ptilogonatidae
name: Ptilogonatidae
common_name: Silky-flycatchers
description: Native to the Americas, the silky-flycatchers are medium-sized songbirds with soft, silky plumage and long, slender tails. They often have conspicuous bristles around the base of their short, broad bills. Most are dark-colored, and most have crests. They typically inhabit tropical and subtropical environments, and only one species is regularly found north of Mexico. They are fairly social and may nest in loose colonies. Small flocks form in the non-breeding season and wander in search of food. Silky-flycatchers eat many insects, but fruit, especially berries, is their main staple. They are typically monogamous, and both sexes help raise the young.
order: passeriformes
