slug: certhiidae
name: Certhiidae
common_name: Creepers
description: Of the seven species in the creeper family, only one can be found in North America. All seven species, however, are similar in appearance, habitat, and behavior. They all eat primarily invertebrates that they glean from tree bark. Creepers are monogamous breeders, and nests are similar in all species. The females generally incubate the eggs, and both parents bring food and care for the young.
order: passeriformes
