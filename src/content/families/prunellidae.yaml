slug: prunellidae
name: Prunellidae
common_name: Accentors
description: The accentors are small, sparrow-like songbirds native to the Old World. A single species, the Siberian Accentor, reaches North America as a rare vagrant. Most members of the family are brown and gray, with some streaking or bold head markings. Most species are secretive birds and spend much of their time on the ground. They hop or walk with an odd shuffle. They are insect-eaters during the summer, but eat many seeds and berries during the winter. Females typically build the nests and incubate the eggs, and both sexes feed and care for the young.
order: passeriformes
