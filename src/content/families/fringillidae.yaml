slug: fringillidae
name: Fringillidae
common_name: Finches and Allies
description: The finch family is made up of acrobatic seedeaters with conical bills and notched tails. Many are nomadic, wandering in winter in search of abundant seeds. Most finch species flock outside the breeding season, and many form flocks during the breeding season as well. Many finches have undulating flight patterns, and may give calls while in flight. They tend to inhabit forest patches and shrubby edges. Most finch species are sexually dimorphic and monogamous, and although the females alone generally incubate the eggs, both sexes help tend the young. Unlike many seed-eating birds that feed protein-rich insects to their young, many finches feed their young mostly seeds.
order: passeriformes
