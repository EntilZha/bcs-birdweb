slug: podicipedidae
name: Podicipedidae
common_name: Grebes
description: Grebes are water-dwelling diving birds with thick, waterproof plumage. They eat fish, aquatic insects, and other small water creatures, and they also eat their own feathers. Grebes are known for their ornate courtship displays, which are among the most elaborate displays of any bird group. During the breeding season they can be found on marshy ponds, where they build floating nests. Both parents tend the cryptically patterned young, which often ride on their backs. In the winter, grebes live on open water. Grebes' legs are set far back on their bodies; this facilitates diving but limits their ability to walk on land.
order: podicipediformes
