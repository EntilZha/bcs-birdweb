slug: rallidae
name: Rallidae
common_name: Rails and Coots
description: This family is made up of wetland dwellers, most with long, unwebbed toes (coots' toes are lobed). Rails are typically elusive and cryptic, while coots are gregarious. Most family members are omnivores and use a variety of foraging techniques. The young are precocial and can walk, swim, and feed themselves shortly after hatching. Both parents help provide parental care for the young.
order: gruiformes
