name: Build and deploy to GitHub Pages

# Unlike bcs-calendar there is no nightly job: BirdWeb has no live upstream feed any more.
# The legacy site was crawled once into a local archive, and the content in src/content/ is
# now the source of truth, edited through tools/birdweb-editor and committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # The content pipeline is Python. uv rather than pixi here: CI only needs to run the
      # scripts, not provision the whole toolchain, and uv resolves in seconds.
      - name: Set up Python
        uses: astral-sh/setup-uv@v5

      - name: Content QA gate
        run: |
          uv run --with pyyaml --with selectolax --with typer --with rich \
            python scripts/verify_extract.py

      # Keep this list in step with [dependencies] in pixi.toml — scripts/tests has a
      # test that fails if they drift, which is how the missing shapely was found (only
      # after CI went red, because the local pixi env had it all along).
      - name: Pipeline tests
        run: |
          uv run --with pytest --with pyyaml --with selectolax --with typer \
            --with rich --with httpx --with pillow --with shapely \
            pytest -q scripts/tests

      # Gates before the build, so a broken content edit fails loudly rather than
      # publishing a page with a missing species or a malformed abundance row.
      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # Browser checks last, because they need the built site. These catch the class of
      # bug the other gates cannot see at all: layout overflow, contrast, hydration
      # mismatches, and links that only break once a real browser follows them.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
